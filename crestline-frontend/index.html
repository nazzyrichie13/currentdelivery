<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="./public/page-icon.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CurrentDelivery Company</title>
    <style>
      /* Fullscreen loading container */
      body, html {
        margin: 0;
        padding: 0;
        height: 100%;
        font-family: Arial, sans-serif;
        background-color: #f0f0f0;
      }

      #loading-container {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        background-color: #f0f0f0;
        z-index: 9999; /* keep on top */
      }

      .spinner {
        border: 6px solid #ddd;
        border-top: 6px solid #007bff;
        border-radius: 50%;
        width: 60px;
        height: 60px;
        animation: spin 1s linear infinite;
        margin-bottom: 20px;
      }

      h1 {
        color: #333;
        font-size: 2rem;
        margin: 0;
      }

      p {
        color: #666;
        margin-top: 5px;
      }

      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <!-- Loading screen -->
    <div id="loading-container">
      <div class="spinner"></div>
      <h1>Loading…</h1>
      <p>Please wait.....</p>
    </div>

    <!-- React mounts here -->
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>

    <script>
      // Remove the loading screen once React mounts
      // Listen for a custom event from React to hide it
      document.addEventListener("DOMContentLoaded", () => {
        // Optional: If React is very fast, hide after a short delay
        setTimeout(() => {
          const loader = document.getElementById("loading-container");
          if (loader) loader.style.display = "none";
        }, 1000); // 1 second fallback
      });
    </script>
  </body>
</html>
