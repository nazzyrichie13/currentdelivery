<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="./public/page-icon.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CurrentDelivery Company</title>
    <style>
      /* Fullscreen loading container */
      body, html {
        margin: 0;
        padding: 0;
        height: 100%;
        font-family: Arial, sans-serif;
        background-color: #f0f0f0;
      }

      #loading-container {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        background-color: #f0f0f0;
        z-index: 9999;
      }

      /* Spinner animation */
      .spinner {
        border: 6px solid #ddd;
        border-top: 6px solid #007bff;
        border-radius: 50%;
        width: 60px;
        height: 60px;
        animation: spin 1s linear infinite;
        margin-bottom: 20px;
      }

      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }

      /* Text fade + pulse */
      h1, p {
        margin: 0;
        text-align: center;
      }

      h1 {
        font-size: 2rem;
        color: #333;
        animation: fadePulse 1.5s ease-in-out infinite;
      }

      p {
        color: #666;
        margin-top: 5px;
        animation: fadePulse 1.5s ease-in-out infinite 0.3s;
      }

      @keyframes fadePulse {
        0%, 100% { opacity: 0.6; transform: scale(1); }
        50% { opacity: 1; transform: scale(1.05); }
      }

      /* Responsive adjustments */
      @media (max-width: 600px) {
        .spinner { width: 50px; height: 50px; border-width: 5px; }
        h1 { font-size: 1.5rem; }
        p { font-size: 0.9rem; }
      }
    </style>
  </head>
  <body>
    <!-- Loader overlay -->
    <div id="loading-container">
      <div class="spinner"></div>
      <h1>Loading…</h1>
      <p>Please wait while the app wakes up.</p>
    </div>

    <!-- React mounts here -->
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>

    <script>
      // Hide loader once React mounts
      const hideLoader = () => {
        const loader = document.getElementById("loading-container");
        if(loader) loader.style.display = "none";
      };

      // Listen for custom event from React
      window.addEventListener("react-mounted", hideLoader);

      // Fallback: hide loader after 5 seconds
      setTimeout(hideLoader, 5000);
    </script>
  </body>
</html>
